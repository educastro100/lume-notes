name: Preparar release Windows

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lume-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'educastro100/lume-notes' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      RUSTUP_TOOLCHAIN: 1.99.0-x86_64-pc-windows-msvc
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
    steps:
      - name: Checkout do codigo-fonte
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Preparar ambiente novo
        run: |
          New-Item -ItemType Directory -Force diagnostics/reports | Out-Null
          node --input-type=module -e "import { releaseVersion } from './scripts/release-candidate.mjs'; await releaseVersion(process.cwd());"
          if ($LASTEXITCODE -ne 0) { throw 'Versao bloqueada ou inconsistente.' }
          rustup toolchain install 1.99.0-x86_64-pc-windows-msvc --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao preparar Rust/MSVC.' }
          @("commit=$env:GITHUB_SHA", "image=$env:ImageOS / $env:ImageVersion", (node --version), (rustc --version --verbose)) | Set-Content diagnostics/reports/environment.txt
      - name: Dependencias travadas
        run: npm ci
      - name: Testes JavaScript
        run: npm run test:ci
      - name: Frontend para os testes nativos
        run: npm run build
      - name: Testes Rust
        run: cargo test --locked --release --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
      - name: Compilar verificador da assinatura e da versao
        run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --example verify-release --target x86_64-pc-windows-msvc
      - name: Compilar instalador sem chave privada
        run: npm run tauri -- build --ci --bundles nsis --target x86_64-pc-windows-msvc --config src-tauri/tauri.diagnostic.conf.json -- --locked
      - name: Conferir pacote final e exigir varredura do Defender
        id: inspect
        run: ./scripts/inspect-diagnostic.ps1 -ReleaseCandidate
      - name: Guardar relatorios de compilacao
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lume-release-reports-${{ github.run_id }}
          path: diagnostics/reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Guardar candidato NAO INSTALAR para assinatura local
        if: steps.inspect.outputs.artifacts_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lume-release-candidate-${{ github.run_id }}
          path: diagnostics/release-candidate/
          if-no-files-found: error
          retention-days: 7
